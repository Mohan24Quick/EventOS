# Optional: use this once you're ready to test against Postgres + Redis
# instead of the default SQLite file. Not required to run the MVP locally.
version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      POSTGRES_DB: eventos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
